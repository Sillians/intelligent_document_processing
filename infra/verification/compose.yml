name: idp-live-verification
x-app: &app
  image: idp-live-verification:local
  volumes:
    - ../..:/app
  environment: &env
    POSTGRES_HOST: postgres
    POSTGRES_USER: idp
    POSTGRES_PASSWORD: local_verification_password
    POSTGRES_DB: idp
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_TASK_QUEUE: idp-verification
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: idpadmin
    S3_SECRET_KEY: idpsecret123
    IDP_REQUIRE_INTERNAL_AUTH: "true"
    IDP_INTERNAL_API_KEY: local-verification-internal
    IDP_OPERATOR_API_KEYS: local-verification-operator:verification,local-verification-operator-other:other
    REVIEW_DECISION_API_KEY: local-verification-worker
    REVIEW_DECISION_API_KEYS: local-verification-review:verification,local-verification-review-other:other
    REVIEW_PROVIDER: label_studio
    REVIEW_FALLBACK_TO_LOCAL_QUEUE: "false"
    LABEL_STUDIO_URL: http://label-studio:8080
    LABEL_STUDIO_TOKEN: local-verification-labelstudio-token
    LABEL_STUDIO_AUTH_SCHEME: token
    LABEL_STUDIO_PROJECT_ID: "1"
    OCR_BACKEND: tesseract
    OCR_TESSERACT_PSM: "6"
    OCR_FORCE_FALLBACK: "false"
    AUTO_APPROVE_THRESHOLD: "1.0"
    EXTRACTION_ENABLE_VLM_FALLBACK: "false"
    LAYOUT_FORCE_FALLBACK: "true"
    DELIVERY_PROVIDERS: object_storage
    DELIVERY_WEBHOOK_URL: ""
    DELIVERY_RECONCILE_INTERVAL_SECONDS: "1"
    DELIVERY_DURABLE_MAX_ATTEMPTS: "3"
    DELIVERY_POLL_INTERVAL_SECONDS: "1"
    DELIVERY_ALLOW_REQUEST_WEBHOOK_URL: "true"
    DELIVERY_WEBHOOK_ALLOWED_HOSTS: ingestion-service
    DELIVERY_WEBHOOK_SECRET: local-verification-webhook-secret
    PREPROCESS_URL: http://preprocess-worker:8010
    OCR_URL: http://ocr-service:8011
    LAYOUT_URL: http://layout-service:8012
    CLASSIFIER_URL: http://classifier-router-service:8013
    EXTRACTION_URL: http://extraction-service:8014
    VALIDATION_URL: http://validation-service:8015
    REVIEW_URL: http://human-review-console:8016
    DELIVERY_URL: http://delivery-service:8017
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: local_verification_password
      POSTGRES_DB: idp
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U idp]
      interval: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: idp
      POSTGRES_PWD: local_verification_password
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:17233:7233"]
    healthcheck:
      test: [CMD-SHELL, "temporal --address temporal:7233 operator namespace list | grep -q default"]
      interval: 5s
      timeout: 5s
      retries: 60
  seaweedfs:
    image: chrislusf/seaweedfs:4.25
    entrypoint: weed
    command: server -s3 -filer -dir=/data -ip=seaweedfs -master.volumeSizeLimitMB=8 -volume.max=64 -volume.minFreeSpace=64MiB
    environment:
      AWS_ACCESS_KEY_ID: idpadmin
      AWS_SECRET_ACCESS_KEY: idpsecret123
    volumes: ["storage:/data"]
  label-studio:
    image: heartexlabs/label-studio:1.20.0
    environment:
      LABEL_STUDIO_USERNAME: verification@example.local
      LABEL_STUDIO_PASSWORD: local-verification-password
      LABEL_STUDIO_USER_TOKEN: local-verification-labelstudio-token
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    volumes: ["labelstudio:/label-studio/data"]
    ports: ["127.0.0.1:18080:8080"]
  ingestion-service:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn ingestion_service.app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *env
      INGESTION_API_KEYS: local-verification-intake:verification,local-verification-intake-other:other
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  workflow-orchestrator:
    <<: *app
    command: python -m workflow_orchestrator.app.worker
    depends_on:
      temporal:
        condition: service_healthy
  preprocess-worker:
    <<: *app
    command: uvicorn preprocess_worker.app.main:app --host 0.0.0.0 --port 8010
  ocr-service:
    <<: *app
    command: uvicorn ocr_service.app.main:app --host 0.0.0.0 --port 8011
  ocr-secondary:
    <<: *app
    command: uvicorn ocr_service.app.main:app --host 0.0.0.0 --port 8011
    environment:
      <<: *env
      OCR_BACKEND: paddle
      OCR_SECONDARY_BACKEND: tesseract
  layout-service:
    <<: *app
    command: uvicorn layout_service.app.main:app --host 0.0.0.0 --port 8012
  classifier-router-service:
    <<: *app
    command: uvicorn classifier_router_service.app.main:app --host 0.0.0.0 --port 8013
  extraction-service:
    <<: *app
    command: uvicorn extraction_service.app.main:app --host 0.0.0.0 --port 8014
  validation-service:
    <<: *app
    command: uvicorn validation_service.app.main:app --host 0.0.0.0 --port 8015
  human-review-console:
    <<: *app
    command: uvicorn human_review_console.app.main:app --host 0.0.0.0 --port 8016
    depends_on:
      postgres:
        condition: service_healthy
  delivery-service:
    <<: *app
    command: uvicorn delivery_service.app.main:app --host 0.0.0.0 --port 8017
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
  storage:
  labelstudio:
